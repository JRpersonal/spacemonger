name: build

# CI for pull requests and pushes to the default branch. Releases are owned by
# release.yml, which repeats the same build and adds attestation and publication.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Only a superseded PR push is cancelled, so back-to-back merges do not leave
  # a red X for a run nobody meant to abandon.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Release-path hygiene that is cheap to check on every PR: workflow syntax
  # (incl. the custom "signing" runner label, declared in
  # .github/actionlint.yaml), the PowerShell release tooling, and the version
  # recorded in CMakeLists.txt / SpaceMonger.rc / README.TXT.
  lint:
    name: lint (workflows, scripts, version)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version is consistent
        run: .\tools\version.ps1

      - name: PSScriptAnalyzer (Error severity)
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -Scope CurrentUser
          $findings = @(Invoke-ScriptAnalyzer -Path tools -Recurse -Severity Error)
          if ($findings.Count -gt 0) { $findings | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host 'No Error-severity findings.'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Digest-pinned to match the SHA-pinned actions. The embedded shellcheck
      # pass is off: workflow syntax is what this job is for.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color -shellcheck=

  build:
    name: ${{ matrix.preset }} ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        preset: [vs2022-win32, vs2022-x64, vs2022-arm64]
        configuration: [Debug, Release]
    env:
      BUILD_PRESET: ${{ matrix.preset }}-${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset $env:BUILD_PRESET

      # ARM64 binaries cannot run on the x64 hosted runner; they are build-only.
      # --timeout: a hung test must not hold the job for the 25 min CTest default.
      - name: Test
        if: matrix.preset != 'vs2022-arm64'
        run: ctest --preset $env:BUILD_PRESET --timeout 120 --output-on-failure

      # The tests never load the app's embedded manifest; this does.
      - name: Smoke test (app starts; ARM64 manifest only)
        run: .\tools\smoke-test.ps1 -Path build/${{ matrix.preset }}/${{ matrix.configuration }}/SpaceMonger.exe ${{ matrix.preset == 'vs2022-arm64' && '-ManifestOnly' || '' }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-log-${{ matrix.preset }}-${{ matrix.configuration }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore

      - name: Upload release executable
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpaceMonger-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Release/SpaceMonger.exe
          if-no-files-found: error
